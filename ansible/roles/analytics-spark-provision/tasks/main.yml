## =========================
## Provision Spark
## =========================

- name: Download Apache Spark
  become: yes
  get_url:
    url: "{{ spark_url }}"
    dest: "{{ analytics.home }}/spark-{{ spark_version }}-bin-hadoop2.7.tgz"
    force: no
    owner: "{{ analytics_user }}"
    group: "{{ analytics_group }}"

- name: Unarchive Spark
  become: yes
  unarchive:
    src: "{{ analytics.home }}/spark-{{ spark_version }}-bin-hadoop2.7.tgz"
    dest: "{{ analytics.home }}/"
    copy: no
    owner: "{{ analytics_user }}"
    group: "{{ analytics_group }}"
    creates: "{{ analytics.home }}/spark-{{ spark_version }}-bin-hadoop2.7"

# -------------------------
# Scala
# -------------------------

- name: Download Scala {{ scala_version }}
  become: yes
  get_url:
    url: "https://downloads.lightbend.com/scala/{{ scala_version }}/scala-{{ scala_version }}.tgz"
    dest: "{{ analytics.soft_path }}/scala-{{ scala_version }}.tgz"
    owner: "{{ analytics_user }}"
    group: "{{ analytics_group }}"

- name: Unarchive Scala {{ scala_version }}
  become: yes
  unarchive:
    src: "{{ analytics.soft_path }}/scala-{{ scala_version }}.tgz"
    dest: "{{ analytics.soft_path }}/"
    copy: no
    owner: "{{ analytics_user }}"
    group: "{{ analytics_group }}"
    creates: "{{ analytics.soft_path }}/scala-{{ scala_version }}"

# -------------------------
# Spark JAR cleanup / add
# -------------------------

- name: Remove Guava 14.0.1
  become: yes
  file:
    path: "{{ analytics.home }}/spark-{{ spark_version }}-bin-hadoop2.7/jars/guava-14.0.1.jar"
    state: absent

- name: Remove jets3t 0.9.3
  become: yes
  file:
    path: "{{ analytics.home }}/spark-{{ spark_version }}-bin-hadoop2.7/jars/jets3t-0.9.3.jar"
    state: absent

- name: Remove java-xmlbuilder 1.0
  become: yes
  file:
    path: "{{ analytics.home }}/spark-{{ spark_version }}-bin-hadoop2.7/jars/java-xmlbuilder-1.0.jar"
    state: absent

- name: Download required Spark jars
  become: yes
  get_url:
    url: "{{ item.url }}"
    dest: "{{ analytics.home }}/spark-{{ spark_version }}-bin-hadoop2.7/jars/{{ item.name }}"
    owner: "{{ analytics_user }}"
    group: "{{ analytics_group }}"
    timeout: 1000
  loop:
    - { name: "jets3t-0.9.7.jar", url: "{{ jets3t_url }}" }
    - { name: "hadoop-aws-2.7.3.jar", url: "{{ hadoop_aws_url }}" }
    - { name: "hadoop-azure-2.7.3.jar", url: "{{ hadoop_azure_url }}" }
    - { name: "azure-storage-3.0.0.jar", url: "{{ azure_storage }}" }
    - { name: "java-xmlbuilder-1.1.jar", url: "{{ java_xmlbuilder_url }}" }

# -------------------------
# Spark configuration
# -------------------------

- name: Update spark defaults
  become: yes
  template:
    src: spark-defaults.j2
    dest: "{{ spark.home }}/conf/spark-defaults.conf"
    owner: "{{ analytics_user }}"
    group: "{{ analytics_group }}"
    mode: "0755"

- name: Update spark env
  become: yes
  template:
    src: spark-env.j2
    dest: "{{ spark.home }}/conf/spark-env.sh"
    owner: "{{ analytics_user }}"
    group: "{{ analytics_group }}"
    mode: "0755"

- name: Copy jets3t properties
  become: yes
  template:
    src: jets3t.j2
    dest: "{{ analytics.home }}/spark-{{ spark_version }}-bin-hadoop2.7/conf/jets3t.properties"
    owner: "{{ analytics_user }}"
    group: "{{ analytics_group }}"
    mode: "0755"

## =========================
## Provision DS
## =========================

- name: Install system packages
  become: yes
  apt:
    name:
      - gcc
      - autoconf
      - curl
      - g++
      - gnupg
      - automake
      - bison
      - libc6-dev
      - libffi-dev
      - libgdbm-dev
      - libncurses5-dev
      - libsqlite3-dev
      - pkg-config
      - sqlite3
      - zlib1g-dev
      - libtool
      - libyaml-dev
      - make
      - libgmp-dev
      - libreadline-dev
      - libssl-dev
      - gpgv2
      - gem
      - ruby
      - gnupg2
      - virtualenv
    state: present
    update_cache: true
    cache_valid_time: 3600

# -------------------------
# RVM / Ruby (ONLY valid place for become_user)
# -------------------------

- name: Import RVM GPG keys (system-wide)
  become: yes
  shell: |
    command -v gpg2 >/dev/null 2>&1 || apt-get install -y gnupg2
    gpg2 --keyserver hkp://keyserver.ubuntu.com --recv-keys \
      409B6B1796C275462A1703113804BB82D39DC0E3 \
      7D2BAF1CF37B13E2069D6956105BD0E739499BDB

- name: Install system RVM
  become: yes
  shell: |
    curl -sSL https://get.rvm.io | bash -s stable
  args:
    creates: /usr/local/rvm/bin/rvm

- name: Load RVM in analytics bashrc
  become: yes
  lineinfile:
    path: /home/{{ analytics_user }}/.bashrc
    line: 'source /etc/profile.d/rvm.sh'
    create: yes
    
- name: Add analytics user to rvm group
  become: yes
  user:
    name: "{{ analytics_user }}"
    groups: rvm
    append: yes

- name: Change ownership
  file:
    path: "{{ analytics.base_path }}"
    owner: "{{ analytics_user }}"
    group: "{{ analytics_user }}"
    recurse: yes
  become: yes

- name: Install Ruby 2.6.6 via RVM
  become_user: "{{ analytics_user }}"
  shell: |
    source /etc/profile.d/rvm.sh
    rvm install ruby-2.6.6
    rvm --default use ruby-2.6.6
  args:
    creates: /home/{{ analytics_user }}/.rvm/rubies/ruby-2.6.6

- name: Add ruby repository
  apt_repository:
    repo: ppa:brightbox/ruby-ng

- name: Install ruby-dev 2.6
  apt:
    name: ruby2.6-dev
    state: present
    update_cache: true

- name: Install ruby-kafka gem
  become_user: "{{ analytics_user }}"
  shell: |
    bash -lc '
      source /etc/profile.d/rvm.sh
      rvm use ruby-2.6.6 --default
      gem install --user-install --no-document ruby-kafka
    '

## -------------------------
## Kafka
## -------------------------

- name: Download Kafka
  get_url:
    url: https://archive.apache.org/dist/kafka/2.8.0/kafka_2.12-2.8.0.tgz
    dest: "{{ analytics.home }}/kafka_2.12-2.8.0.tgz"
    owner: "{{ analytics_user }}"
    group: "{{ analytics_group }}"
  tags:
    - kafka-provision

- name: Unarchive Kafka
  unarchive:
    src: "{{ analytics.home }}/kafka_2.12-2.8.0.tgz"
    dest: "{{ analytics.home }}/"
    copy: no
    owner: "{{ analytics_user }}"
    group: "{{ analytics_group }}"
    creates: "{{ analytics.home }}/kafka_2.12-2.8.0"
  tags:
    - kafka-provision

## -------------------------
## Python 3.6
## -------------------------

- name: Add python ppa
  apt_repository:
    repo: ppa:deadsnakes/ppa

- name: Install python 3.6
  apt:
    name: python3.6
    state: present
    update_cache: true
